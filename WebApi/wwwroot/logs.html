<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Logs - GrillPizza</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Log List</h3>
            <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>

        <div id="error" class="alert alert-danger" style="display:none;"></div>

        <ul id="logList" class="list-group mb-3"></ul>

        <div class="d-flex justify-content-end align-items-center gap-2">
            <select id="countSelect" class="form-select w-auto">
                <option value="10">10</option>
                <option value="25">25</option>
                <option value="50" selected>50</option>
            </select>
            <button id="showLogsBtn" class="btn btn-primary">Show Logs</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        }

        async function loadLogs() {
            const count = document.getElementById('countSelect').value;

            const response = await fetch(`/api/Log/get/${count}`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.status === 401) {
                window.location.href = '/login.html';
                return;
            }

            if (response.ok) {
                const logs = await response.json();
                const logList = document.getElementById('logList');
                logList.innerHTML = '';

                logs.forEach(log => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item';
                    li.innerHTML = `<span class="badge bg-${log.level === 'ERROR' ? 'danger' : log.level === 'WARN' ? 'warning' : 'info'} me-2">${log.level}</span>
                                   <small class="text-muted me-2">${new Date(log.timestamp).toLocaleString()}</small>
                                   ${log.message}`;
                    logList.appendChild(li);
                });
            } else {
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Error loading logs.';
            }
        }

        document.getElementById('showLogsBtn').addEventListener('click', loadLogs);

        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        loadLogs();
    </script>
</body>
</html>
